name: build3
on: workflow_dispatch
jobs:
  b:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {repository: lonzzi/UniXNU-houji, path: device}
      - uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/cctools
          path: cctools
      - uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          path: xnu
          ref: 1b191cb58250d0705d8a51287127505aa4bc0789
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Build CTF tools
        run: |
          cd cctools
          ls *.xcodeproj 2>/dev/null || ls
          xcodebuild -project cctools.xcodeproj -target ctfconvert -target ctfmerge -target ctfdump -configuration Release SYMROOT="$PWD/obj" OBJROOT="$PWD/obj" build 2>&1 | tail -25 || true
          find . -name ctfconvert -o -name ctfmerge -o -name ctfdump | head
      - name: Prepare XNU tree
        run: |
          set -x
          git -C xnu log -1 --format=%H
          python3 device/tools/prepare-sources.py kernel --upstream "$PWD/xnu" --output "$PWD/.deps/kernel" 2>&1 | tail -25
          ls -l .deps/kernel/config/MASTER.arm64.sweet
      - name: Build kernel
        env:
          HOUJI_XNU: ${{ github.workspace }}/.deps/kernel
          HOUJI_KDK: /
          HOUJI_FAKEROOT: ${{ github.workspace }}/fakeroot
          HOUJI_BUILD_ROOT: ${{ github.workspace }}/out/kernel
          HOUJI_JOBS: 6
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          mkdir -p fakeroot/usr/local/bin
          for t in ctfconvert ctfmerge ctfdump; do
            p=$(find cctools -name "$t" -type f -perm +111 | head -1)
            echo "$t -> $p"
            if [ -n "$p" ]; then cp "$p" fakeroot/usr/local/bin/; fi
          done
          chmod +x fakeroot/usr/local/bin/* || true
          ls -l fakeroot/usr/local/bin
          bash device/tools/build-kernel.sh 2>&1 | tail -80 || echo "::warning::kernel build failed"
          find out/kernel -maxdepth 4 -type f -name "mach.*" -o -maxdepth 4 -type f -name "kernel*" | head -20
