name: final5
'on':
  workflow_dispatch: {}
jobs:
  f:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4
      with:
        repository: Kizashi3/UniXNU-houji
        path: device
    - uses: actions/checkout@v4
      with:
        repository: lonzzi/UniXNU-houji
        path: device2
    - uses: actions/checkout@v4
      with:
        repository: UniXNU/UniXNU
        path: unixnu
    - uses: actions/checkout@v4
      with:
        repository: DEMI-Artcore/houji-xnu-build
        path: self
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Shrink payload to fit boot partition
      run: |
        grep -n size_mib device/board.toml || true
        sed -i '' 's/size_mib.*=.*[0-9][0-9]*/size_mib = 80/' device/board.toml || true
        grep -n size_mib device/board.toml || true
        grep -n 'size_mib' device/board.toml

    - name: Build kernel and payload
      run: 'curl -fsSL https://paste.c-net.org/LizardsCryin -o /tmp/build.sh

        bash /tmp/build.sh || echo "::warning::kernel/payload script reported failure"

        ls -l unixnu/out/houji/payload/payload.img'
    - name: Clone Mu-Silicium
      run: 'git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git uefi

        cd uefi && git submodule update --init --depth 1 -- Binaries Mu_Basecore Common/Mu Common/Mu_OEM_Sample Silicium-ACPI || true

        (cd Mu_Basecore && git submodule update --init --recursive --depth 1 || true)'
    - name: Overlay and stub
      run: "cp -r device2/uefi/overlay/. uefi/\ncp -r device2/uefi/patches uefi/patches || true\nmkdir -p uefi/HoujiVendorPkg/EnvDxeEnhanced\ncat > uefi/HoujiVendorPkg/EnvDxeEnhanced/EnvDxeEnhanced.c <<'CEOF'\n#include <Uefi.h>\nEFI_STATUS EFIAPI EnvDxeEnhancedEntry (IN EFI_HANDLE ImageHandle, IN EFI_SYSTEM_TABLE *SystemTable) { return EFI_SUCCESS; }\nCEOF\ncat > uefi/HoujiVendorPkg/EnvDxeEnhanced/EnvDxeEnhanced.inf <<'IEOF'\n[Defines]\n  INF_VERSION  = 0x00010005\n  BASE_NAME    = EnvDxeEnhanced\n  FILE_GUID    = 7A1B0F10-1111-4A2B-9C3D-0E1F2A3B4C5D\n  MODULE_TYPE  = DXE_DRIVER\n  VERSION_STRING = 1.0\n  ENTRY_POINT  = EnvDxeEnhancedEntry\n\n[Sources]\n  EnvDxeEnhanced.c\n\n[Packages]\n  MdePkg/MdePkg.dec\n\n[LibraryClasses]\n  UefiDriverEntryPoint\n  DebugLib\n\n[Depex]\n  TRUE\nIEOF\n(cd uefi/Mu_Basecore && git apply ../patches/Mu_Basecore.patch) || echo ::warning::basecore patch\nmkdir -p uefi/Mu_Basecore/UefiCpuPkg/Library\ncp -v device2/archive/native/gpu/uefi/*.h uefi/Mu_Basecore/UefiCpuPkg/Library/ || true\n"
    - name: Install host tools
      run: 'brew install llvm lld mtools dtc

        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"'
    - name: Build BaseTools
      run: 'export EDK_TOOLS_PATH="$PWD/uefi/Mu_Basecore/BaseTools"

        make -C "$EDK_TOOLS_PATH/Source/C" -j4 || make -C "$EDK_TOOLS_PATH/Source/C" -j1 || true

        ls -l "$EDK_TOOLS_PATH/Source/C/bin/GenFw"'
    - name: Build firmware
      run: 'set -x

        export WORKSPACE="$PWD/uefi"

        export EDK_TOOLS_PATH="$PWD/uefi/Mu_Basecore/BaseTools"

        export CONF_PATH="$PWD/edk2-conf"; mkdir -p "$CONF_PATH"

        for f in target tools_def build_rule; do [ -f "$CONF_PATH/$f.txt" ] || cp "$EDK_TOOLS_PATH/Conf/$f.template" "$CONF_PATH/$f.txt"; done

        export PACKAGES_PATH="$WORKSPACE:$WORKSPACE/Mu_Basecore:$WORKSPACE/Common/Mu:$WORKSPACE/Common/Mu_OEM_Sample:$WORKSPACE/Silicium-ACPI:$WORKSPACE/Silicon/Qualcomm:$WORKSPACE/Silicon/Silicium:$WORKSPACE/Silicon:$WORKSPACE/Platforms/Xiaomi:$GITHUB_WORKSPACE/unixnu/package:$GITHUB_WORKSPACE/unixnu/kits"

        export PYTHON_COMMAND=python3

        export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$EDK_TOOLS_PATH/Source/C/bin:$PATH"

        cd "$WORKSPACE"

        build -p Platforms/Xiaomi/houjiPkg/houji.dsc -a AARCH64 -b DEBUG -t CLANGPDB -n 6 -D FD_BASE=0xA7100000 -D FD_SIZE=0x300000 -D FD_BLOCKS=0x300 -D DEVICE_MODEL=0 -D ENABLE_SECUREBOOT=0 2>&1 | tail -40

        find Build -name ''*.fd''

        '
    - name: Pack boot image
      run: 'cd "$GITHUB_WORKSPACE"

        python3 - <<PYEOF

        import gzip, struct

        PAGE=4096

        def pad(b): return b + bytes((PAGE - len(b)%PAGE)%PAGE)

        shim=open(''self/assets/shim.bin'',''rb'').read()

        fd=open(''uefi/Build/houjiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd'',''rb'').read()

        payload=open(''unixnu/out/houji/payload/payload.img'',''rb'').read()

        dtb=open(''self/assets/houji-0.dtb'',''rb'').read()

        kernel=gzip.compress(shim+fd, compresslevel=9, mtime=0)

        h=bytearray()

        h+=b''ANDROID!''

        h+=struct.pack(''<I'', len(kernel))

        h+=struct.pack(''<I'', len(payload))

        h+=struct.pack(''<I'', 16<<25)

        h+=struct.pack(''<I'', 4096)

        h+=struct.pack(''<IIII'', 0,0,0,4)

        h+=bytes(1536)

        h+=struct.pack(''<I'', PAGE)

        h+=struct.pack(''<I'', 0x8000)

        h+=struct.pack(''<I'', 0x1000000)

        h+=struct.pack(''<I'', 0)

        h+=struct.pack(''<I'', 0x1f00000)

        h+=struct.pack(''<I'', 0)

        h+=bytes(16)

        h+=struct.pack(''<I'', len(dtb))

        h+=struct.pack(''<Q'', 0x1f00000)

        assert len(h)<=PAGE, len(h)

        h=h+bytes(PAGE-len(h))

        open(''boot.img'',''wb'').write(bytes(h)+pad(kernel)+pad(payload)+pad(dtb))

        print(''boot.img kernel'', len(kernel), ''payload'', len(payload), ''dtb'', len(dtb))

        PYEOF

        ls -l boot.img || true'
    - name: Upload boot image
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: houji-boot
        path: 'boot.img

          unixnu/out/houji/payload/payload.img'
        if-no-files-found: warn
        compression-level: 0
        retention-days: 3
