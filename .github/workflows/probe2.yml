name: probe2
on: workflow_dispatch
jobs:
  p:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {repository: lonzzi/UniXNU-houji, path: device}
      - name: probe
        run: |
          set -x
          echo "=== KernelSupport"; ls /System/Library/KernelSupport 2>/dev/null | head
          find / -maxdepth 6 -name "ctfconvert" -o -maxdepth 6 -name "ctfmerge" -o -maxdepth 6 -name "ctfdump" 2>/dev/null | head
          echo "=== xcode toolchain bins"; ls /Applications/Xcode_*.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/ 2>/dev/null | grep -i ctf | head
          echo "=== DeviceSupport"; ls /Library/Developer/CoreSimulator/Volumes 2>/dev/null | head
          echo "=== docs list"; ls device/docs
          echo "=== dev doc grep"; grep -n -i -E "kdk|ctf|fakeroot|prepare-sources|build-kernel|bootimg|payload|firmware" device/docs/development.md | head -40
